[project]
name = "multimercado-alpha"
version = "0.1.0"
description = "Do Brazilian multimercado funds deliver alpha after fees, or just CDI plus market beta?"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "requests>=2.34.2",
    "statsmodels>=0.15.0",
    "yfinance>=1.8.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
